# The shipped plugin has no dependencies (stdlib only), so there is no gomod
# ecosystem to watch — the only thing to keep current is the CI actions.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
