name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.21", "1.22", "1.24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...

      # Interpret the plugin exactly as Traefik does — the catalog's own
      # validation (Piceus) loads plugins through Yaegi. Pinned to v0.15.1, the
      # version whose abandon-path bug this plugin works around; `go run` keeps
      # Yaegi out of the plugin's go.mod (the catalog rejects that dependency).
      - name: Yaegi compatibility
        run: go run github.com/traefik/yaegi/cmd/yaegi@v0.15.1 test .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
